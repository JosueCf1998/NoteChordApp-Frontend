<app-top-navbar [title]="title || 'Nota'" [showTitle]="false" [floatingControls]="true">
  <ion-buttons nav-start slot="start">
    <ion-button [disabled]="isLocked" (click)="backToNotes()" aria-label="Volver a notas">
      <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
    </ion-button>
  </ion-buttons>
  <ion-buttons nav-end slot="end">
    <ion-button
      id="note-format-trigger"
      class="header-icon-button format-btn"
      [class.is-shifted]="semitoneOffset !== 0"
      [disabled]="!hasContent || isLocked"
      (click)="onFormatClick()"
      aria-label="Ajustar tonalidad"
    >
      <span slot="icon-only" class="format-t-icon" [class.is-shifted]="semitoneOffset !== 0" aria-hidden="true">{{ formatButtonLabel }}</span>
    </ion-button>
    <ion-button
      id="note-options-trigger"
      [disabled]="!hasContent || isLocked"
      (click)="openOptions()"
      aria-label="Más opciones"
    >
      <ion-icon slot="icon-only" name="ellipsis-horizontal"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-top-navbar>

<ion-content
  [fullscreen]="true"
  [scrollEvents]="true"
  (ionScroll)="handleScroll($event)"
  (touchstart)="handleGestureStart($event)"
  (touchmove)="handleGestureMove($event)"
  (touchend)="handleGestureEnd()"
  (touchcancel)="handleGestureCancel()"
>
  <main class="editor-container" (click)="onContainerClick($event)" *ngIf="!isLoading; else loadingState">

    <!-- Fecha animada: se revela al deslizar hacia arriba -->
    <div
      class="note-date-wrapper"
      [class.visible]="isDateVisible"
      *ngIf="formattedFullDate"
      aria-hidden="true"
    >
      <p class="note-date">{{ formattedFullDate }}</p>
    </div>

    <!-- Único campo de editor: primera línea en tamaño título, salto de línea en texto normal -->
    <div class="editor-wrapper">
      <div class="editor-placeholder" *ngIf="!hasContent" aria-hidden="true">
        Empieza a escribir…
      </div>
      <div
        #editor
        class="single-note-editor"
        [class.locked]="isLocked"
        style="outline: none; border: none; box-shadow: none;"
        [attr.contenteditable]="!isLocked"
        (keydown)="onEditorKeydown($event)"
        (keyup)="onEditorKeyup($event)"
        (input)="onEditorInput()"
        (paste)="onEditorPaste($event)"
        role="textbox"
        aria-multiline="true"
        aria-label="Contenido de la nota"
        autocapitalize="sentences"
        spellcheck="true"
      ></div>
    </div>

    <p class="error-message" role="alert" aria-live="polite" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </main>

  <ng-template #loadingState>
    <div class="loading-message" aria-live="polite">
      <ion-spinner name="crescent"></ion-spinner>
      <span>Cargando nota…</span>
    </div>
  </ng-template>

  <!-- FAB: modo bloqueo (candado, deshabilitado si no hay contenido y no está bloqueada) -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button
      class="lock-fab"
      [class.is-locked]="isLocked"
      [disabled]="!hasContent && !isLocked"
      (click)="toggleLock()"
      [attr.aria-label]="isLocked ? 'Desbloquear nota' : 'Bloquear nota'"
    >
      <ion-icon [name]="isLocked ? 'lock-closed' : 'lock-open-outline'"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<!-- Menú de opciones de la nota -->
<app-action-menu
  [isOpen]="isOptionsOpen"
  trigger="note-options-trigger"
  [items]="noteMenuItems"
  (closed)="closeOptions()"
></app-action-menu>

<!-- Alertita de Tonalidad (Transposición de acordes en 1/2 tono) -->
<app-transpose-modal
  [isOpen]="isTransposeModalOpen"
  trigger="note-format-trigger"
  [semitones]="semitoneOffset"
  [originalKey]="detectedOriginalKey"
  [preferFlats]="preferFlatsForTranspose"
  (semitonesChange)="onSemitonesChange($event)"
  (applied)="onTransposeApplied($event)"
  (cancelled)="onTransposeCancelled()"
  (closed)="closeTransposeModal()"
></app-transpose-modal>

<!-- Modal base de confirmación para eliminar nota -->
<app-base-modal
  size="sm"
  [isOpen]="isDeleteConfirmOpen"
  title="Eliminar nota"
  [description]="'¿Estás seguro de que deseas eliminar ' + (title ? '“' + title + '”' : 'esta nota') + '? Esta acción no se puede deshacer.'"
  [primaryText]="isDeleting ? 'Eliminando…' : 'Eliminar'"
  secondaryText="Cancelar"
  primaryRole="danger"
  [bodyless]="true"
  [primaryDisabled]="isDeleting"
  [secondaryDisabled]="isDeleting"
  (closed)="closeDeleteConfirm()"
  (secondary)="closeDeleteConfirm()"
  (primary)="confirmDelete()"
></app-base-modal>
