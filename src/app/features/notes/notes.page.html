<app-top-navbar [title]="title || 'Nota'" [showTitle]="false" [floatingControls]="true">
  <ion-buttons nav-start slot="start">
    <ion-button (click)="backToNotes()" aria-label="Volver a notas">
      <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
    </ion-button>
  </ion-buttons>
  <ion-buttons nav-end slot="end">
    <ion-button class="header-icon-button" (click)="shareNote()" aria-label="Compartir nota">
      <ion-icon slot="icon-only" name="share-outline"></ion-icon>
    </ion-button>
    <ion-button id="note-options-trigger" (click)="openOptions()" aria-label="Más opciones">
      <ion-icon slot="icon-only" name="ellipsis-horizontal"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-top-navbar>

<ion-content
  [fullscreen]="true"
  [scrollEvents]="true"
  (ionScroll)="handleScroll($event)"
  (touchstart)="handleGestureStart($event)"
  (touchmove)="handleGestureMove($event)"
  (touchend)="handleGestureEnd()"
  (touchcancel)="handleGestureCancel()"
>
  <main class="editor-container" *ngIf="!isLoading; else loadingState">

    <!-- Fecha animada: se revela al deslizar hacia arriba -->
    <div
      class="note-date-wrapper"
      [class.visible]="isDateVisible"
      *ngIf="formattedFullDate"
      aria-hidden="true"
    >
      <p class="note-date">{{ formattedFullDate }}</p>
    </div>

    <ion-input
      [(ngModel)]="title"
      (ngModelChange)="onTitleChange()"
      name="title"
      class="note-title"
      placeholder="Título"
      maxlength="120"
      aria-label="Título de la nota"
      autocapitalize="sentences"
    ></ion-input>

    <ion-textarea
      id="note-content"
      [(ngModel)]="content"
      (ngModelChange)="onContentChange()"
      name="content"
      class="note-content"
      placeholder="Escribe aquí notas, acordes o letra..."
      maxlength="20000"
      aria-label="Contenido de la nota"
      auto-grow="true"
      autocorrect="on"
      autocapitalize="sentences"
      spellcheck="true"
    ></ion-textarea>

    <p class="error-message" role="alert" aria-live="polite" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </main>

  <ng-template #loadingState>
    <div class="loading-message" aria-live="polite">
      <ion-spinner name="crescent"></ion-spinner>
      <span>Cargando nota…</span>
    </div>
  </ng-template>

  <!-- FAB: nueva nota -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button
      class="new-note-fab"
      (click)="createAnotherNote()"
      aria-label="Nueva nota"
    >
      <ion-icon name="create-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<ion-popover [isOpen]="isOptionsOpen" trigger="note-options-trigger" (didDismiss)="closeOptions()">
  <ng-template>
    <ion-list class="options-list">
      <ion-item button lines="none" (click)="shareNote(); closeOptions()">
        <ion-icon slot="start" name="share-outline"></ion-icon>
        <ion-label>Compartir nota</ion-label>
      </ion-item>
      <ion-item button lines="none" color="danger" (click)="openDeleteConfirm()">
        <ion-icon slot="start" name="trash-outline"></ion-icon>
        <ion-label>Eliminar nota</ion-label>
      </ion-item>
    </ion-list>
  </ng-template>
</ion-popover>

<!-- Modal base de confirmación para eliminar nota -->
<app-base-modal
  size="sm"
  [isOpen]="isDeleteConfirmOpen"
  title="Eliminar nota"
  [description]="'¿Estás seguro de que deseas eliminar ' + (title ? '“' + title + '”' : 'esta nota') + '? Esta acción no se puede deshacer.'"
  [primaryText]="isDeleting ? 'Eliminando…' : 'Eliminar'"
  secondaryText="Cancelar"
  primaryRole="danger"
  [bodyless]="true"
  [primaryDisabled]="isDeleting"
  [secondaryDisabled]="isDeleting"
  (closed)="closeDeleteConfirm()"
  (secondary)="closeDeleteConfirm()"
  (primary)="confirmDelete()"
></app-base-modal>
