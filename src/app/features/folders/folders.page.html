<app-top-navbar title="Carpetas" [showTitle]="isHeaderCollapsed" [floatingControls]="true">
    <ion-buttons nav-end slot="end">
      <ion-button (click)="openSearch()" aria-label="Buscar">
        <ion-icon slot="icon-only" name="search-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="openSettings()" aria-label="Abrir ajustes">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
</app-top-navbar>

<ion-content
  [scrollEvents]="true"
  (ionScroll)="pageTitle.handleScroll($event)"
  (touchstart)="pageTitle.handleGestureStart($event)"
  (touchmove)="pageTitle.handleGestureMove($event)"
  (touchend)="pageTitle.handleGestureEnd($event)"
  (touchcancel)="pageTitle.handleGestureCancel()"
>
  <main class="folders-container">
    <app-animated-page-title
      #pageTitle
      title="Carpetas"
      (collapsedChange)="isHeaderCollapsed = $event"
    ></app-animated-page-title>

    <ion-text color="danger" role="alert" *ngIf="errorMessage">
      <p class="error-message">{{ errorMessage }}</p>
    </ion-text>

    <ng-container *ngIf="filteredFolders$ | async as filteredFolders">
      <app-grouped-list class="folder-list" *ngIf="filteredFolders.length; else emptyState">
        <ion-item-sliding *ngFor="let folder of filteredFolders; trackBy: trackByFolderId">
          <ion-item
            button
            detail="false"
            (click)="handleFolderClick(folder.id)"
            (pointerdown)="startLongPress($event, folder)"
            (pointermove)="trackLongPress($event)"
            (pointerup)="cancelLongPress()"
            (pointercancel)="cancelLongPress()"
            (pointerleave)="cancelLongPress()"
            (contextmenu)="$event.preventDefault(); openFolderOptions(folder)"
          >
            <div class="folder-icon" slot="start">
              <ion-icon name="folder-outline"></ion-icon>
            </div>
            <ion-label>
              <h2>{{ folder.name }}</h2>
            </ion-label>
            <span class="folder-count" *ngIf="noteCounts$ | async as counts">{{ counts[folder.id] || 0 }}</span>
            <ion-icon class="row-chevron" name="chevron-forward-outline" slot="end" aria-hidden="true"></ion-icon>
          </ion-item>
          <app-swipe-actions
            (edit)="openEditFolder(folder)"
            (remove)="deleteFolder(folder.id, folder.name)"
          ></app-swipe-actions>
        </ion-item-sliding>
      </app-grouped-list>
    </ng-container>

    <ng-template #emptyState>
      <section class="empty-state">
        <div class="empty-icon"><ion-icon name="folder-outline"></ion-icon></div>
        <h2>{{ searchTerm ? 'Sin resultados' : 'Sin carpetas' }}</h2>
        <p class="empty-description">
          {{ searchTerm ? 'Prueba con otra palabra clave o limpia la búsqueda.' : 'Crea tu primera carpeta para empezar a organizar tus notas.' }}
        </p>
      </section>
    </ng-template>

  </main>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button
      class="action-fab"
      (click)="openCreateFolder()"
      aria-label="Nueva carpeta"
    >
      <span class="folder-add-icon" aria-hidden="true">
        <ion-icon class="folder-shape" name="folder-outline"></ion-icon>
        <ion-icon class="plus-shape" name="add-outline"></ion-icon>
      </span>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<app-base-modal
  [isOpen]="isFolderFormOpen"
  [title]="editingFolder ? 'Editar carpeta' : 'Nueva carpeta'"
  [description]="editingFolder ? 'Modifica los datos de tu carpeta' : 'Organiza tus acordes, letras y canciones'"
  [primaryText]="isSaving ? 'Guardando…' : (editingFolder ? 'Guardar cambios' : 'Crear carpeta')"
  secondaryText="Cancelar"
  [primaryDisabled]="isSaving || !folderName.trim()"
  [secondaryDisabled]="isSaving"
  (closed)="closeFolderForm()"
  (secondary)="closeFolderForm()"
  (primary)="saveFolder()"
>
  <form (ngSubmit)="saveFolder()">
    <label class="modal-field">
      <span>Nombre</span>
      <input
        [(ngModel)]="folderName"
        name="folderName"
        placeholder="Ej. Alabanza, Acústicos, Repertorio"
        maxlength="40"
        enterkeyhint="done"
        autofocus
      />
    </label>

    <ion-text color="danger" role="alert" *ngIf="errorMessage">
      <p class="error-message">{{ errorMessage }}</p>
    </ion-text>

    <button class="hidden-submit" type="submit" [disabled]="isSaving || !folderName.trim()">Guardar</button>
  </form>
</app-base-modal>

<app-full-screen-loader [visible]="isSaving" message="Guardando…"></app-full-screen-loader>

<app-base-modal
  size="sm"
  [isOpen]="pendingDelete !== null"
  title="Eliminar carpeta"
  [description]="'¿Quieres eliminar ' + (pendingDelete?.name || '') + '? Esta acción no se puede deshacer.'"
  [primaryText]="isDeleting ? 'Eliminando…' : 'Eliminar'"
  secondaryText="Cancelar"
  primaryRole="danger"
  [bodyless]="true"
  [primaryDisabled]="isDeleting"
  [secondaryDisabled]="isDeleting"
  (closed)="cancelFolderDelete()"
  (secondary)="cancelFolderDelete()"
  (primary)="confirmFolderDelete()"
></app-base-modal>
