<ion-content>
  <button type="button" class="login-back-btn" (click)="backToSplash()" aria-label="Volver al inicio">
    <ion-icon name="chevron-back-outline"></ion-icon>
  </button>
  <main class="login-container">
    <section class="login-panel">
      <div class="brand-mark">
        <img src="assets/branding/notechord-logo.png" alt="NoteChord">
      </div>

      <div class="brand-copy">
        <h1>NoteChord</h1>
        <p>Tus notas. Siempre contigo.</p>
      </div>

      <div class="login-form-wrapper">
        <form (ngSubmit)="login()">
          <ion-item>
            <ion-input
              [(ngModel)]="email"
              name="email"
              type="email"
              label="Correo electrónico"
              labelPlacement="stacked"
              autocomplete="email"
              required
            ></ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              [(ngModel)]="password"
              name="password"
              type="password"
              label="Contraseña"
              labelPlacement="stacked"
              autocomplete="current-password"
              required
            ></ion-input>
          </ion-item>

          <button class="forgot-password" type="button" *ngIf="!isRegisterMode" (click)="recoverPassword()">
            ¿Olvidaste tu contraseña?
          </button>

          <ion-text color="danger" role="alert" *ngIf="errorMessage">
            <p class="error-message">{{ errorMessage }}</p>
          </ion-text>

          <ion-text color="success" role="status" *ngIf="statusMessage">
            <p class="status-message">{{ statusMessage }}</p>
          </ion-text>

          <ion-button expand="block" type="submit" [disabled]="isSubmitting || !email || !password">
            {{ isSubmitting ? 'Procesando...' : (isRegisterMode ? 'Crear cuenta' : 'Iniciar sesión') }}
          </ion-button>
        </form>

        <p class="account-switch">
          {{ isRegisterMode ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?' }}
          <button type="button" (click)="toggleRegisterMode()">
            {{ isRegisterMode ? 'Inicia sesión' : 'Regístrate' }}
          </button>
        </p>
      </div>
    </section>
  </main>
</ion-content>
