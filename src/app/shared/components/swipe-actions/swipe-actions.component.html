<ion-item-options side="end">
  <ion-item-option color="primary" (click)="edit.emit()" aria-label="Editar">
    <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
  </ion-item-option>
  <ion-item-option color="danger" (click)="remove.emit()" aria-label="Eliminar">
    <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
  </ion-item-option>
</ion-item-options>
