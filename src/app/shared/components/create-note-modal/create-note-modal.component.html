<app-base-modal
  [isOpen]="isOpen"
  [title]="selectedType === 'music' ? 'Nueva Partitura' : 'Nueva Nota'"
  [description]="selectedType === 'music' ? 'Partitura con acordes y transporte' : 'Nota estándar para textos y apuntes'"
  primaryText="Crear"
  secondaryText="Cancelar"
  [primaryDisabled]="!isFormValid"
  (closed)="handleClose()"
  (secondary)="handleClose()"
  (primary)="handleSubmit()"
  (didDismiss)="handleDidDismiss()"
>
  <div class="create-note-body">
    <!-- Selector de Tipo: Partitura vs Nota -->
    <div class="type-selector" role="radiogroup" aria-label="Tipo de nota">
      <button
        type="button"
        class="type-option"
        [class.selected]="selectedType === 'music'"
        role="radio"
        [attr.aria-checked]="selectedType === 'music'"
        (click)="setType('music')"
      >
        <div class="type-icon-wrapper music-icon">
          <ion-icon name="musical-notes"></ion-icon>
        </div>
        <div class="type-info">
          <span class="type-title">Partitura</span>
          <span class="type-subtitle">Con acordes</span>
        </div>
      </button>

      <button
        type="button"
        class="type-option"
        [class.selected]="selectedType === 'standard'"
        role="radio"
        [attr.aria-checked]="selectedType === 'standard'"
        (click)="setType('standard')"
      >
        <div class="type-icon-wrapper note-icon">
          <ion-icon name="document-text-outline"></ion-icon>
        </div>
        <div class="type-info">
          <span class="type-title">Nota</span>
          <span class="type-subtitle">Solo texto</span>
        </div>
      </button>
    </div>

    <!-- Campos del Formulario (Heredados del sistema de modales) -->
    <form (ngSubmit)="handleSubmit()" class="form-container">
      <label class="modal-field">
        <span>{{ selectedType === 'music' ? 'Título de la partitura' : 'Título de la nota' }}</span>
        <input
          #titleInput
          [(ngModel)]="title"
          name="noteTitle"
          [placeholder]="selectedType === 'music' ? 'Ej. Rey de Reyes, Way Maker' : 'Ej. Ideas de ensayo, Recordatorio'"
          maxlength="100"
          autocomplete="off"
          enterkeyhint="next"
          required
        />
      </label>

      <label class="modal-field" *ngIf="selectedType === 'music'">
        <span>Autor / Artista <span class="optional-tag">(opcional)</span></span>
        <input
          [(ngModel)]="author"
          name="noteAuthor"
          placeholder="Ej. Hillsong, Sinach, Marcos Witt"
          maxlength="100"
          autocomplete="off"
          enterkeyhint="done"
        />
      </label>

      <button class="hidden-submit" type="submit" [disabled]="!isFormValid" tabindex="-1">Crear</button>
    </form>
  </div>
</app-base-modal>
